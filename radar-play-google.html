<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<script src="js/registro.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Radar Play</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@700;800&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.5/jsmediatags.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
/* Pantalla de coche tipo CarPlay: dock a la izquierda; panel con mapa + tarjetas; apps a pantalla completa */
:root{--bg:#06080b;--bg2:#0b0e12;--panel:#13171d;--panel-2:#1c2229;--line:#272e37;--fg:#f1f4f7;--muted:#8a94a1;--accent:#b44fe0;--ok:#34c46a;--stop:#ff4d4f;
  --f-d:"Barlow Condensed","Arial Narrow",sans-serif;--f-b:"Barlow",system-ui,sans-serif;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:var(--f-b);font-size:15px;overflow:hidden}
button,input{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.app{position:fixed;inset:0;display:flex}

/* Dock */
.dock{width:96px;flex:none;background:#080a0d;border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:14px 0;gap:12px;z-index:5}
.clock{font-family:var(--f-d);font-weight:800;font-size:26px}
.recents{flex:1;display:flex;flex-direction:column;gap:12px;justify-content:center}
.dock .ico{width:58px;height:58px}
.homebtn{width:58px;height:58px;border-radius:16px;background:var(--panel-2);display:grid;place-items:center}
.homebtn span{display:grid;grid-template-columns:repeat(3,7px);gap:4px}
.homebtn i{width:7px;height:7px;border-radius:2px;background:var(--fg)}
.homebtn.dash span{grid-template-columns:repeat(2,11px)}.homebtn.dash i{width:11px;height:11px}
.ico{width:84px;height:84px;border-radius:22%;display:grid;place-items:center;position:relative;transition:transform .15s}
.ico svg{width:52%;height:52%;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ico:active{transform:scale(.92)}
.eq{position:absolute;right:-4px;bottom:-4px;width:20px;height:20px;border-radius:50%;background:var(--accent);display:flex;align-items:flex-end;justify-content:center;gap:2px;padding:5px 4px}
.eq i{width:2px;background:#fff;height:40%;animation:eq .8s ease-in-out infinite alternate}
.eq i:nth-child(2){animation-delay:-.3s}.eq i:nth-child(3){animation-delay:-.6s}
@keyframes eq{to{height:100%}}

/* Zona principal y vistas */
.main{position:relative;flex:1;min-width:0;background:var(--bg2)}
.stage{position:absolute;inset:0;overflow:hidden;transition:right .25s,top .25s,bottom .25s,left .25s,border-radius .25s}
.main[data-view=panel] .stage{top:10px;left:10px;bottom:10px;right:calc(38% + 10px);border-radius:18px}
#map{position:absolute;inset:0;background:#1b2027}
.side{position:absolute;top:10px;right:10px;bottom:10px;width:calc(38% - 10px);display:none;flex-direction:column;gap:10px}
.main[data-view=panel] .side{display:flex}
.appview{position:absolute;inset:0;background:var(--bg2);display:none;flex-direction:column;z-index:3}
.main.inapp .appview{display:flex}
.main[data-view=panel] .turn,.main[data-view=panel] .eta,.main[data-view=panel] .radar,.main[data-view=panel] .mctl .big{display:none}

/* Elementos del mapa */
.turn{position:absolute;top:14px;left:14px;max-width:min(440px,60%);background:rgba(8,10,13,.93);border-left:5px solid var(--accent);border-radius:12px;padding:10px 14px;z-index:2}
.turn b{font-family:var(--f-d);font-size:30px;display:block;line-height:1}
.turn span{color:var(--muted);font-weight:600}
.eta{position:absolute;left:14px;right:90px;bottom:14px;background:rgba(8,10,13,.93);border-radius:12px;padding:10px 14px;display:flex;gap:22px;align-items:center;flex-wrap:wrap;z-index:2}
.eta div{display:flex;flex-direction:column}
.eta b{font-family:var(--f-d);font-size:24px;line-height:1}
.eta small{color:var(--muted);font-weight:600}
.eta .r{margin-left:auto;display:flex;flex-direction:row;gap:8px}
.radar{position:absolute;right:90px;top:14px;width:200px;height:200px;z-index:2;overflow:hidden;border:6px solid #000;box-shadow:0 8px 30px rgba(0,0,0,.6)}
.radar.circle{border-radius:50%}
.radar.rect{border-radius:12px;height:150px;width:230px}
#radarmap{position:absolute;inset:0}
.radar .car{position:absolute;left:50%;top:50%;width:0;height:0;z-index:3;pointer-events:none}
.radar .car::before{content:"";position:absolute;left:-9px;top:-12px;border-left:9px solid transparent;border-right:9px solid transparent;border-bottom:22px solid var(--car,#fff);filter:drop-shadow(0 0 2px #000);transform:rotate(var(--h,0deg));transform-origin:9px 12px}
.mctl{position:absolute;right:14px;top:14px;bottom:14px;display:flex;flex-direction:column;gap:8px;z-index:2}
.mbtn{width:62px;height:62px;border-radius:14px;background:rgba(8,10,13,.93);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10px;font-weight:700;color:var(--muted)}
.mbtn svg{width:24px;height:24px;stroke:var(--fg);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.mbtn.on{background:var(--accent);color:#fff}
.mbtn.z{font-size:26px;color:var(--fg);font-weight:600}
.mctl .sp{flex:1}
.main[data-view=panel] .mctl{top:auto;flex-direction:row}

/* Tarjetas del panel */
.card{background:var(--panel);border-radius:18px;position:relative;overflow:hidden;min-height:0}
.side .card{flex:1;display:flex;flex-direction:column;justify-content:center;padding:16px;gap:8px}
.cardlabel{font-size:11px;font-weight:800;letter-spacing:.1em;color:var(--muted);text-transform:uppercase}
.big{font-family:var(--f-d);font-size:36px;font-weight:800;line-height:1}
.np{display:flex;gap:14px;align-items:center;min-width:0}
.cover{width:84px;height:84px;border-radius:12px;flex:none;background:linear-gradient(135deg,var(--accent),#111);display:grid;place-items:center;overflow:hidden}
.cover img{width:100%;height:100%;object-fit:cover}
.cover svg{width:40%;stroke:#fff;fill:none;stroke-width:2;opacity:.8}
.meta{flex:1;min-width:0}
.meta b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:17px}
.meta span{color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctrls{display:flex;gap:6px;align-items:center}
.cbtn{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;flex:none}
.cbtn svg{width:22px;height:22px;fill:var(--fg)}
.cbtn.big{width:58px;height:58px;background:var(--fg)}.cbtn.big svg{fill:var(--bg)}
.cbtn.opt svg{fill:none;stroke:var(--muted);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.cbtn.opt.on svg{stroke:var(--accent)}
.prog{height:5px;background:var(--line);border-radius:3px;overflow:hidden}.prog i{display:block;height:100%;width:0;background:var(--fg)}

/* Apps */
.appbar{height:60px;flex:none;display:flex;align-items:center;gap:10px;padding:0 20px;border-bottom:1px solid var(--line)}
.appbar h2{margin:0;font-family:var(--f-d);font-size:28px}
.appbar .sp{flex:1}
.abody{flex:1;min-height:0;overflow:auto;padding:18px 20px}
.home{justify-content:center;align-items:center}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:22px 18px;justify-items:center}
.tile{display:flex;flex-direction:column;align-items:center;gap:8px;font-weight:600;font-size:14px}
.pill{background:var(--panel-2);border-radius:999px;padding:9px 16px;font-weight:700;text-decoration:none;color:var(--fg);display:inline-flex;align-items:center;gap:6px}
.pill.on{background:var(--accent);color:#fff}
.pill.stop{background:var(--stop);color:#fff}
.muted{color:var(--muted)}
.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:14px;padding:10px 6px;border-bottom:1px solid var(--line);text-align:left;width:100%;border-radius:8px}
.row:hover{background:var(--panel)}
.row.on{background:var(--panel-2)}
.row.on b{color:var(--accent)}
.row .n{width:28px;text-align:right;color:var(--muted);font-variant-numeric:tabular-nums;flex:none}
.row .t{flex:1;min-width:0}.row .t b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.row .t small{color:var(--muted)}
.row .av{width:44px;height:44px;border-radius:50%;background:var(--panel-2);display:grid;place-items:center;font-weight:800;flex:none}
.music{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:24px;height:100%}
.player{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;min-width:0}
.player .cover{width:min(240px,32vh);height:min(240px,32vh);border-radius:18px}
.player .t{text-align:center;min-width:0;max-width:100%}
.player .t b{font-size:24px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seek{width:100%;max-width:380px}
.seek input,.vol input{width:100%;accent-color:var(--accent)}
.times{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.vol{display:flex;align-items:center;gap:8px;width:100%;max-width:280px;color:var(--muted)}
.vol svg{width:20px;flex:none;stroke:currentColor;fill:none;stroke-width:2}
.qhead{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.qhead input{flex:1;min-width:140px;background:var(--panel-2);border:1px solid var(--line);border-radius:999px;padding:9px 14px}
.queue{min-height:0;overflow:auto;display:flex;flex-direction:column}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;height:100%;max-width:520px;margin:0 auto}
.empty p{color:var(--muted);line-height:1.5;margin:0}
.note{background:var(--panel-2);border-radius:14px;padding:12px 14px;font-size:14px;color:var(--muted);line-height:1.45}
.set{display:flex;align-items:center;justify-content:space-between;padding:14px 4px;border-bottom:1px solid var(--line);gap:12px}
.set input[type=text]{background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:9px 12px;min-width:0;width:320px;max-width:50vw}
.tog{width:52px;height:30px;border-radius:15px;background:var(--line);position:relative;flex:none}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .2s}
.tog.on{background:var(--ok)}.tog.on::after{left:25px}

/* Ventanas */
.overlay{position:fixed;inset:0;z-index:10;background:rgba(4,5,7,.75);display:flex;align-items:center;justify-content:center;padding:16px}
.box{width:min(640px,100%);max-height:100%;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:22px}
.box h2{font-family:var(--f-d);font-size:32px;margin:0 0 6px}
.box p,.box li{color:var(--muted);line-height:1.5}
.box li b{color:var(--fg)}
.field{display:flex;gap:8px;margin-top:12px}
.field input{flex:1;min-width:0;background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:16px}
.themes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:10px}
.theme{background:var(--panel-2);border:2px solid transparent;border-radius:14px;padding:10px;text-align:left}
.theme.on{border-color:var(--accent)}
.theme b{font-family:var(--f-d);font-size:20px;display:block}
.theme small{color:var(--muted)}
.swatch{height:46px;border-radius:8px;margin-bottom:8px;position:relative;overflow:hidden}
.swatch i{position:absolute}
.recent{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.toast{position:fixed;left:50%;top:18px;transform:translateX(-50%);background:var(--accent);color:#fff;font-family:var(--f-d);font-weight:800;font-size:20px;padding:10px 20px;border-radius:12px;z-index:20}
/* DNA y motor */
.dnab{width:58px;height:40px;border-radius:12px;background:var(--panel-2);border:1px solid var(--line);font-family:var(--f-d);font-weight:800;font-size:20px;line-height:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--accent)}
.dnab small{font-family:var(--f-b);font-size:8px;letter-spacing:.12em;color:var(--muted)}
.dnasel{display:flex;gap:4px;background:var(--panel-2);border-radius:999px;padding:4px}
.dnasel button{width:46px;height:38px;border-radius:999px;font-family:var(--f-d);font-weight:800;font-size:20px;color:var(--muted)}
.dnasel button.on{background:var(--accent);color:#fff}
.leds{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:3px;height:16px}
.leds i{background:#2a1d20;border-radius:2px;transform:skewX(-14deg)}
.leds i.on{background:#f1f4f7}.leds i.y.on{background:#ffb020}.leds i.r.on{background:#ff2b34;box-shadow:0 0 10px #ff2b34}
.leds.shift i.on{animation:blink .15s steps(2) infinite}
@keyframes blink{50%{opacity:.25}}
.leds.big{height:clamp(22px,5vh,44px);gap:4px}
.ledscale{display:flex;justify-content:space-between;font-family:var(--f-d);font-weight:700;color:var(--muted);font-size:14px;margin-top:4px}
#enginecard{flex:1.15}
body:not([data-dna=D]) #enginecard{display:none!important}
.erow{display:flex;justify-content:space-between;align-items:baseline}
.erow b{font-family:var(--f-d);font-size:30px;font-style:italic}
.dlabel{font-family:var(--f-d);font-weight:800;font-style:italic;letter-spacing:.16em;color:var(--accent)}
.egrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:6px}
.egrid div{display:flex;flex-direction:column}
.egrid small{font-size:10px;font-weight:800;letter-spacing:.1em;color:var(--muted)}
.egrid b{font-family:var(--f-d);font-size:34px;line-height:1;font-style:italic}
.egrid div:first-child b{color:var(--accent);font-size:42px}
.egrid em{font-style:normal;color:var(--muted);font-size:12px}
.motor{display:flex;flex-direction:column;gap:16px}
.mtop{display:flex;gap:24px;align-items:stretch;background:var(--panel);border-radius:18px;padding:16px 20px}
.mgear{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:110px;border-right:1px solid var(--line);padding-right:20px}
.mgear small{font-size:11px;font-weight:800;letter-spacing:.12em;color:var(--muted)}
.mgear b{font-family:var(--f-d);font-size:110px;line-height:.9;font-style:italic;color:var(--accent);text-shadow:0 0 30px color-mix(in srgb,var(--accent) 50%,transparent)}
.mrev{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:8px}
.mrevnum{display:flex;align-items:baseline;gap:10px}
.mrevnum>b{font-family:var(--f-d);font-size:64px;line-height:1;font-style:italic}
.mrevnum>span{color:var(--muted);font-weight:800;letter-spacing:.1em}
.mspd{margin-left:auto;color:var(--fg)!important;letter-spacing:0!important}
.mspd b{font-family:var(--f-d);font-size:44px;font-style:italic}
.gauges{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.gcard{background:var(--panel);border-radius:16px;aspect-ratio:1.35;padding:6px;min-width:0}
.gcard canvas{width:100%;height:100%;display:block}
.dnaflash{position:fixed;inset:0;z-index:30;display:grid;place-items:center;pointer-events:none;background:radial-gradient(circle,rgba(255,43,52,.5),rgba(8,3,4,.92) 70%);animation:flash 1.5s ease forwards}
.dnaflash b{font-family:var(--f-d);font-size:clamp(48px,10vw,130px);font-style:italic;letter-spacing:.08em;color:#fff;text-shadow:0 0 30px #ff2b34;animation:slide 1.5s ease forwards}
.dnaflash.A{background:radial-gradient(circle,rgba(56,182,255,.4),rgba(3,6,9,.92) 70%)}.dnaflash.A b{text-shadow:0 0 30px #38b6ff}
.dnaflash.N{background:radial-gradient(circle,rgba(220,225,235,.2),rgba(3,6,9,.92) 70%)}
@keyframes flash{0%{opacity:0}15%,70%{opacity:1}100%{opacity:0}}
@keyframes slide{0%{transform:translateX(-30%) skewX(-12deg);opacity:0}25%,75%{transform:none;opacity:1}100%{transform:translateX(20%);opacity:0}}
/* Aspecto agresivo en Dynamic */
body[data-dna=D] .main{background:repeating-linear-gradient(45deg,#0e0809 0 6px,#0a0607 6px 12px)}
body[data-dna=D] .appview{background:repeating-linear-gradient(45deg,#0e0809 0 6px,#0a0607 6px 12px)}
body[data-dna=D] .dock{background:#0c0607;border-right-color:#5a1219;box-shadow:inset -2px 0 16px rgba(255,43,52,.3)}
body[data-dna=D] .card,body[data-dna=D] .gcard,body[data-dna=D] .mtop{background:#170d0f;box-shadow:inset 0 0 0 1px #3d1c21}
body[data-dna=D] .appbar{border-bottom-color:#5a1219;background:linear-gradient(90deg,rgba(255,43,52,.22),transparent 60%)}
body[data-dna=D] .appbar h2,body[data-dna=D] .big,body[data-dna=D] .clock,body[data-dna=D] .turn b{font-style:italic}
body[data-dna=D] .main[data-view=panel] .stage{box-shadow:0 0 0 2px #ff2b34,0 0 26px rgba(255,43,52,.35)}
body[data-dna=D] .dnab{background:#ff2b34;color:#fff;box-shadow:0 0 16px rgba(255,43,52,.6);font-style:italic}
body[data-dna=D] .dnab small{color:#fff}
body[data-dna=D] .pill.on{box-shadow:0 0 14px rgba(255,43,52,.45)}
/* YouTube */
.cpbtn{width:58px;height:58px;border-radius:16px;background:linear-gradient(160deg,#fff,#cfd6df);color:#111;font-weight:800;font-size:13px;line-height:1.05}
#ytbox{position:fixed;z-index:6;background:#000;border-radius:12px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.6)}
#ytbox.mini{right:96px;bottom:96px;width:224px;height:126px}
#ytplayer,#ytbox iframe{width:100%;height:100%;display:block;border:0}
#ytbox.marcha::after{content:'Solo sonido mientras conduces';position:absolute;inset:0;display:grid;place-items:center;background:#0b0b0d;color:#9aa4b1;font:600 15px/1.3 var(--f-b,sans-serif);text-align:center;padding:10px}
.ytslot{width:100%;max-width:520px;aspect-ratio:16/9;border-radius:14px;background:#000}
.ytcard{display:flex;gap:12px;align-items:center;min-width:0}
.ytcard .ytslot{width:44%;max-width:none;flex:none}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chips .pill{padding:6px 12px;font-size:13px;max-width:240px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.yrow img{width:72px;height:54px;object-fit:cover;border-radius:8px;flex:none;background:#000}
@media (max-width:760px){.gauges{grid-template-columns:repeat(2,minmax(0,1fr))}.mtop{flex-direction:column}.mgear{border-right:0;padding-right:0}.egrid b{font-size:26px}}
@media (prefers-reduced-motion:reduce){.leds.shift i.on{animation:none}.dnaflash,.dnaflash b{animation:flash 1s linear forwards}}
@media (prefers-reduced-motion:reduce){.eq i{animation:none;height:70%}.stage{transition:none}}
@media (max-width:760px){
  .app{flex-direction:column-reverse}
  .dock{width:100%;flex-direction:row;justify-content:space-around;padding:8px;border-right:0;border-top:1px solid var(--line)}
  .recents{flex-direction:row;flex:none}
  .dock .ico,.homebtn{width:50px;height:50px}
  .clock{font-size:20px}
  .main[data-view=panel] .stage{right:10px;bottom:calc(45% + 10px)}
  .side{width:auto;left:10px;top:auto;height:45%}
  .grid{grid-template-columns:repeat(3,1fr)}.ico{width:66px;height:66px}
  .music{grid-template-columns:1fr;height:auto}
  .radar{width:130px;height:130px}.radar.rect{width:150px;height:105px}
  .themes{grid-template-columns:repeat(2,minmax(0,1fr))}
  .eta{right:14px;bottom:90px}
  .mctl{top:auto;flex-direction:row;flex-wrap:wrap;justify-content:flex-end;left:14px}
  .mctl .sp{display:none}
}

/* ===== Navegación tipo Google Maps ===== */
.ltop{position:absolute;top:14px;left:14px;width:min(460px,calc(100% - 330px));display:flex;flex-direction:column;gap:8px;z-index:3;pointer-events:none}
.ltop>*{pointer-events:auto}
.turn{position:static;max-width:none;display:flex;align-items:center;gap:14px;padding:12px 16px;border-left:0;background:rgba(10,13,17,.94);border-radius:16px;box-shadow:0 8px 24px rgba(0,0,0,.45)}
body[data-nav] .turn{background:color-mix(in srgb,var(--accent) 82%,#000);color:#fff}
.tman{width:62px;height:62px;flex:none;display:grid;place-items:center}
.mani{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:4.5;stroke-linecap:round;stroke-linejoin:round}
.turn .tx{min-width:0}
.turn b{font-family:var(--f-d);font-size:40px;line-height:1}
.turn span{display:block;color:inherit;opacity:.85;font-weight:600;font-size:16px;line-height:1.25;margin-top:2px}
.then{align-self:flex-start;display:flex;align-items:center;gap:8px;background:color-mix(in srgb,var(--accent) 60%,#000);color:#fff;border-radius:0 0 12px 12px;margin-top:-8px;padding:6px 12px 6px 16px;font-weight:700}
.then .mani{width:28px;height:28px;stroke-width:5}
.alertb{display:flex;align-items:center;gap:12px;background:rgba(10,13,17,.95);border-radius:14px;padding:10px 14px;box-shadow:0 8px 24px rgba(0,0,0,.4);border:1px solid var(--line)}
.alertb svg{flex:none}
.alertb .at{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.2}
.alertb .at b{font-size:15px}
.alertb .ad{font-family:var(--f-d);font-size:28px;font-weight:800;line-height:1.05}
.alertb .at>span:not(.ad){color:var(--muted);font-weight:600;font-size:13px}
.alertb .at small{color:var(--muted);font-size:11px}
.alertb .bad{color:var(--stop)!important}
.lsign{width:56px;height:56px;border-radius:50%;background:#fff;border:6px solid #e5322d;color:#111;display:grid;place-items:center;font-family:var(--f-d);font-weight:800;font-size:22px;flex:none}
.banner{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;background:#1d74e8;color:#fff;border-radius:14px;padding:10px 12px;font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.banner .pill{background:rgba(255,255,255,.18);color:#fff}.banner .pill.on{background:#fff;color:#1d74e8}
.banner div{display:flex;gap:6px}
.radar{right:84px}
.spd{position:absolute;left:14px;bottom:92px;z-index:2;display:flex;align-items:center;gap:8px}
.spd .lim{width:62px;height:62px;border-radius:50%;background:#fff;border:7px solid #e5322d;color:#111;display:grid;place-items:center;font-family:var(--f-d);font-weight:800;font-size:25px;box-shadow:0 6px 16px rgba(0,0,0,.4)}
.spd .cur{background:rgba(10,13,17,.94);border-radius:12px;padding:6px 10px;display:flex;flex-direction:column;align-items:center;min-width:64px}
.spd .cur b{font-family:var(--f-d);font-size:28px;line-height:1}
.spd .cur small{color:var(--muted);font-size:11px;font-weight:700}
.spd.over .cur{background:#e5322d}.spd.over .cur small{color:#fff}
.eta{right:84px}
.eta b.ok{color:#34c46a}.eta b.mid{color:#f5a623}.eta b.bad{color:#ff4d4f}
.mctl{gap:6px}
.mbtn{width:56px;height:56px;font-size:10px}
.mbtn small{font-size:10px}
.mbtn b{font-family:var(--f-d);font-size:20px;color:var(--fg)}
.mbtn.off svg{stroke:var(--stop)}.mbtn.off small{color:var(--stop)}
#bTraf.on{background:#2e7d32;color:#fff}
.simonly{display:none}
body[data-sim] .simonly{display:flex}
.main[data-view=panel] .turn,.main[data-view=panel] .then,.main[data-view=panel] .spd,.main[data-view=panel] .preview{display:none!important}
.main[data-view=panel] .ltop{width:calc(100% - 28px)}
/* Vista previa de rutas */
.preview{position:absolute;left:14px;top:14px;bottom:14px;width:min(400px,46%);z-index:4;background:rgba(12,15,19,.97);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px;overflow:auto;box-shadow:0 10px 30px rgba(0,0,0,.5)}
body[data-nav] .preview{display:none}
.stage:has(#preview:not([hidden])) .ltop{display:none}
.preview:not([hidden])~.ltop,.preview:not([hidden])~.mctl{}
.pvh small{color:var(--muted);font-weight:800;letter-spacing:.1em;font-size:11px}
.pvh b{display:block;font-family:var(--f-d);font-size:28px;line-height:1.05}
.pvh span{display:block;color:var(--muted);font-size:13px}
.pvl{display:flex;flex-direction:column;gap:8px}
.rcard{background:var(--panel-2);border:2px solid transparent;border-radius:14px;padding:10px 12px;text-align:left;display:flex;flex-direction:column;gap:6px}
.rcard.on{border-color:var(--accent)}
.rc1{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.rc1 b{font-family:var(--f-d);font-size:30px;line-height:1}
.rc1 b.ok{color:#34c46a}.rc1 b.mid{color:#f5a623}.rc1 b.bad{color:#ff4d4f}
.rc1 span{color:var(--muted);font-weight:600}
.rc2{display:flex;gap:6px;flex-wrap:wrap}
.tag{background:var(--accent);color:#fff;border-radius:6px;padding:2px 8px;font-size:12px;font-weight:800}
.tag.dim{background:var(--line);color:var(--fg)}
.tr{background:#0b0e12;border-radius:6px;padding:2px 8px;font-size:12px;font-weight:700;color:var(--muted)}
.tr.ok{color:#34c46a}.tr.bad{color:#ff8a4d}
.rcard small{color:var(--muted)}
.pvo{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:var(--panel-2);border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-weight:700;font-size:13px}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.pvb{display:flex;gap:8px;margin-top:auto}
.pvb .go{flex:1;justify-content:center;font-size:18px;padding:12px}
.rlab{background:#111!important;padding:4px 9px;border-radius:9px;border:2px solid #fff;box-shadow:0 3px 10px rgba(0,0,0,.5);transform:translateY(-14px)}
.rlab.on{background:var(--accent)!important}
/* Notificar */
.rgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:8px}
.rtile{background:var(--panel-2);border-radius:14px;padding:12px 6px;display:flex;flex-direction:column;align-items:center;gap:8px;font-weight:700;font-size:13px;text-align:center}
/* Pasos */
.steps .row{cursor:default}
.steps .row.on{background:color-mix(in srgb,var(--accent) 25%,transparent)}
.steps .row.past{opacity:.45}
.sman{width:40px;height:40px;flex:none;color:var(--fg)}
/* Tarjeta del panel */
.nc{display:flex;gap:14px;align-items:center;min-width:0}
.ncman{width:64px;height:64px;flex:none;color:var(--accent)}
.ncsub{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sugs{display:flex;flex-direction:column;gap:6px;min-height:0;overflow:hidden}
.sug{background:var(--panel-2);border-radius:12px;padding:8px 12px;text-align:left;display:flex;flex-direction:column;min-width:0}
.sug b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sug small{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* Llamadas, notificaciones, Siri */
.callui{position:fixed;top:14px;right:90px;width:min(560px,calc(100vw - 32px));z-index:40;background:rgba(18,22,28,.97);border:1px solid var(--line);border-radius:20px;padding:12px 14px;display:flex;align-items:center;gap:14px;box-shadow:0 14px 40px rgba(0,0,0,.6)}
.cav,.nav2{width:52px;height:52px;border-radius:50%;background:linear-gradient(160deg,#8a94a1,#4b535d);display:grid;place-items:center;font-weight:800;font-size:22px;flex:none}
.cinfo{flex:1;min-width:0;display:flex;flex-direction:column}
.cinfo b{font-size:20px}.cinfo span{color:var(--muted)}
.cbtns{display:flex;gap:10px}
.cb{width:56px;height:56px;border-radius:50%;background:var(--panel-2);display:grid;place-items:center;color:#fff}
.cb.red{background:#e5322d}.cb.green{background:#34c46a}.cb.on{background:#fff;color:#111}
.notif{position:fixed;top:14px;right:90px;width:min(460px,calc(100vw - 32px));z-index:35;background:rgba(18,22,28,.97);border:1px solid var(--line);border-radius:18px;padding:12px;display:flex;align-items:center;gap:12px;box-shadow:0 14px 40px rgba(0,0,0,.6)}
.notif .nav2{background:linear-gradient(160deg,#5ee07e,#26b04a)}
.nt{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.25}
.nt small{color:var(--muted);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.08em}
.nt span{color:var(--muted);font-size:13px}
.nb{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.nb .pill{padding:7px 12px;font-size:13px}
.siribtn{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:#000;border:1px solid var(--line)}
.siribtn span,.orb{display:block;width:34px;height:34px;border-radius:50%;background:conic-gradient(from 0deg,#ff4f9a,#8a5cff,#2fd3ff,#47f5a5,#ff4f9a);filter:blur(.5px);animation:spin 6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.siri{position:fixed;left:96px;right:0;bottom:0;z-index:45;background:linear-gradient(180deg,rgba(6,8,11,0),rgba(6,8,11,.96) 30%);padding:40px 24px 22px;display:flex;align-items:center;gap:20px}
.siri .orb{width:84px;height:84px;flex:none;position:relative;animation:spin 3s linear infinite;box-shadow:0 0 40px rgba(138,92,255,.6)}
.siri.on .orb{animation:spin 1s linear infinite,pulse2 1.2s ease-in-out infinite}
@keyframes pulse2{50%{transform:scale(1.12) rotate(180deg)}}
.siri .st{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.siri .st b{font-size:26px;line-height:1.15}
.siri .st>span{color:var(--muted)}
.srin{display:flex;gap:8px;max-width:520px}
.srin input{flex:1;min-width:0;background:var(--panel-2);border:1px solid var(--line);border-radius:999px;padding:9px 14px}
.bdg{position:absolute;top:-6px;right:-6px;min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:#ff3b30;color:#fff;font-size:12px;font-weight:800;display:grid;place-items:center;border:2px solid var(--bg)}
/* Teléfono y mensajes */
.tabs{display:inline-flex;background:var(--panel-2);border-radius:999px;padding:4px;gap:4px;margin-bottom:10px;flex-wrap:wrap}
.tabs button{border-radius:999px;padding:8px 16px;font-weight:700;color:var(--muted)}
.tabs button.on{background:var(--accent);color:#fff}
.row.missed b{color:var(--stop)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#2f7fd6;margin-right:6px;vertical-align:middle}
.kpad{display:flex;flex-direction:column;align-items:center;gap:12px;padding:10px 0}
.kdisp{font-size:32px;min-height:40px;letter-spacing:.06em}
.kgrid{display:grid;grid-template-columns:repeat(3,68px);gap:12px}
.key{width:68px;height:68px;border-radius:50%;background:var(--panel-2);font-size:26px;font-weight:600;display:grid;place-items:center}
.key.green{background:#34c46a}
.msgv{display:flex;flex-direction:column;gap:12px}
.bubbles{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:8px;padding:4px}
.bub{max-width:70%;background:var(--panel-2);border-radius:18px 18px 18px 4px;padding:10px 14px;align-self:flex-start;font-size:16px}
.bub.me{align-self:flex-end;background:#2f7fd6;color:#fff;border-radius:18px 18px 4px 18px}
.bub small{display:block;font-size:11px;opacity:.7;margin-top:2px}
.qr{display:flex;gap:8px;flex-wrap:wrap}
.qrbox{background:#fff;padding:8px;border-radius:12px;min-width:20px}
.qrbox:empty{display:none}
h3.sh{font-family:var(--f-d);font-size:22px;margin:18px 0 0;color:var(--accent)}
h3.sh:first-child{margin-top:0}
.set textarea{background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:9px 12px;width:320px;max-width:50vw;color:var(--fg);font:inherit;resize:vertical}
@media (max-width:760px){
  .ltop{width:calc(100% - 28px)}
  .preview{left:8px;right:8px;width:auto;top:auto;max-height:65%}
  .rgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .siri{left:0;bottom:76px}
  .callui,.notif{right:16px}
  .dock .dnab{display:none}
  .siribtn{width:50px;height:50px}
  .spd{bottom:150px}
}
@media (prefers-reduced-motion:reduce){.siribtn span,.orb{animation:none}}

/* ===== Sistema (Raspberry) ===== */
body[data-kiosk]:not([data-raton]),body[data-kiosk]:not([data-raton]) *{cursor:none!important}
body[data-kiosk]{user-select:none;-webkit-user-select:none;overscroll-behavior:none;touch-action:manipulation}
body[data-kiosk] input,body[data-kiosk] textarea{user-select:text;-webkit-user-select:text}
#boot{position:fixed;inset:0;z-index:100;background:radial-gradient(circle at 50% 38%,#1d0a2a,#040508 60%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;transition:opacity .6s}
#boot.out{opacity:0;pointer-events:none}
.bradar{width:min(38vh,300px);aspect-ratio:1;border-radius:50%;position:relative;overflow:hidden;border:2px solid #6b7380;margin-bottom:14px;box-shadow:0 0 60px rgba(180,79,224,.35)}
.bradar i{position:absolute;border-radius:50%;border:1.5px solid rgba(160,170,190,.45);inset:auto}
.bradar .r1{inset:16%}.bradar .r2{inset:33%}.bradar .r3{inset:47%;border-color:rgba(160,170,190,.3)}
.bradar .sweep{inset:0;border:0;background:conic-gradient(from 0deg,rgba(180,79,224,.9),rgba(180,79,224,.15) 22%,transparent 30%);animation:spin 1.6s linear infinite}
.bcar{position:absolute;left:50%;top:50%;width:0;height:0;border-left:11px solid transparent;border-right:11px solid transparent;border-bottom:26px solid #fff;transform:translate(-50%,-55%)}
.bt{font-family:var(--f-d);font-weight:800;font-style:italic;font-size:clamp(40px,8vw,84px);letter-spacing:.06em;line-height:1;animation:rise .8s ease both}
.bs{color:var(--muted);font-size:18px;font-weight:600;animation:rise .8s .15s ease both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
#bchk{list-style:none;padding:0;margin:18px 0 0;display:grid;gap:6px;min-width:min(420px,90vw)}
#bchk li{display:flex;gap:10px;align-items:baseline;animation:rise .35s ease both;color:var(--muted)}
#bchk li i{font-style:normal;width:18px;color:#6b7380;font-weight:800}
#bchk li.ok i{color:#34c46a}
#bchk li b{color:var(--fg);width:110px}
#osk{position:fixed;left:96px;right:0;bottom:0;z-index:60;background:#0b0e12;border-top:1px solid var(--line);padding:8px;display:flex;flex-direction:column;gap:6px;box-shadow:0 -10px 30px rgba(0,0,0,.5)}
.okr{display:flex;gap:6px;justify-content:center}
#osk button{flex:1;max-width:84px;height:52px;border-radius:10px;background:var(--panel-2);font-size:21px;font-weight:600;color:var(--fg)}
#osk button.fn{background:#2a313a;font-size:15px;max-width:110px}
#osk button.sp{flex:6;max-width:none}
#osk button.on{background:var(--accent);color:#fff}
#osk button:active{background:var(--accent)}
body.osk .overlay{align-items:flex-start;padding-top:24px}
body.osk .siri{bottom:300px}
#pwr{position:fixed;inset:0;z-index:90;background:rgba(4,5,7,.88);display:grid;place-items:center}
.pbox{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:28px 30px;text-align:center;max-width:min(520px,92vw)}
.pico{font-size:52px;color:var(--stop)}
.pbox h2{font-family:var(--f-d);font-size:38px;margin:6px 0}
.pbox p{font-size:20px;color:var(--muted)}
.pbox p b{font-family:var(--f-d);font-size:56px;color:var(--fg)}
.pbtn{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
#bye{position:fixed;inset:0;z-index:110;background:#000;color:#8a94a1;display:grid;place-items:center;font-size:22px;font-weight:700}
.stiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.stile{background:var(--panel);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0;border-left:4px solid #34c46a}
.stile.mid{border-left-color:#f5a623}.stile.bad{border-left-color:#ff4d4f}
.stile small{color:var(--muted);font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.stile b{font-family:var(--f-d);font-size:28px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stile span{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srange{display:flex;align-items:center;gap:10px;width:min(320px,45vw)}
.srange input{flex:1;accent-color:var(--accent)}
.srange b{width:34px;text-align:right}
.pill:disabled{opacity:.4;cursor:default}
@media (max-width:760px){ .stiles{grid-template-columns:repeat(2,minmax(0,1fr))} #osk{left:0;bottom:76px} #osk button{height:44px;font-size:17px} }

/* ===== Cámaras ===== */
.camcv,.camvid{position:absolute;inset:0;width:100%;height:100%;display:block;object-fit:fill;background:#000}
.camwrap{display:flex;justify-content:center}
.camsingle{position:relative;width:min(100%,calc((100vh - 190px)*1.7778));aspect-ratio:16/9;max-height:calc(100vh - 190px);background:#000;border-radius:16px;overflow:hidden}
.guides{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2}
.guides line{stroke-width:1.1;stroke-linecap:round;vector-effect:non-scaling-stroke;stroke-width:5px;filter:drop-shadow(0 0 2px #000)}
.birdwrap{display:flex;justify-content:center}
.birdbox{position:relative;aspect-ratio:4/3;width:100%;background:#0b0d10;border-radius:16px;overflow:hidden}
.birdbox.big{width:min(100%,calc((100vh - 190px)*1.3333))}
.carov{position:absolute;inset:0;width:100%;height:100%;z-index:2;pointer-events:none;filter:drop-shadow(0 4px 10px rgba(0,0,0,.6))}
.grid4{display:grid;grid-template-columns:1fr 1fr 1fr;grid-template-rows:auto auto auto;gap:8px;max-width:980px;margin:0 auto}
.g4{position:relative;aspect-ratio:16/9;background:#000;border-radius:12px;overflow:hidden}
.g4 small{position:absolute;left:8px;top:6px;z-index:2;font-weight:800;font-size:11px;letter-spacing:.08em;text-transform:uppercase;text-shadow:0 1px 3px #000}
.g4-front{grid-column:2;grid-row:1}.g4-left{grid-column:1;grid-row:2}.g4-right{grid-column:3;grid-row:2}.g4-rear{grid-column:2;grid-row:3}
.g4car{grid-column:2;grid-row:2;position:relative;aspect-ratio:16/9}
.g4car .carov{filter:none}
#rev{position:fixed;inset:0;z-index:80;background:#000;display:flex;gap:10px;padding:10px}
.rvmain{flex:1;min-width:0;position:relative;display:flex;align-items:center;justify-content:center}
.rvbox{position:relative;width:100%;max-height:100%;aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:#000}
.rvtop{position:absolute;top:14px;left:14px;z-index:3;background:rgba(0,0,0,.6);border-radius:12px;padding:8px 14px;display:flex;flex-direction:column}
.rvtop b{font-family:var(--f-d);font-size:24px;letter-spacing:.08em;color:#ffcc00}
.rvtop span{font-size:13px;color:#cfd6dd}
.rvx{position:absolute;top:14px;right:14px;z-index:3}
.rvside{width:min(34vw,420px);display:flex;flex-direction:column;justify-content:center;gap:6px;color:var(--muted);font-weight:700;font-size:13px;text-align:center}
.rvside .birdbox{aspect-ratio:3/4}
.calgrid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:18px;align-items:start}
.camsingle.cal{width:100%;cursor:crosshair}
.tap{position:absolute;z-index:3;width:28px;height:28px;margin:-14px 0 0 -14px;border-radius:50%;background:#20c7b5;color:#000;font-weight:800;display:grid;place-items:center;border:2px solid #fff}
.calside ol{padding-left:18px;margin:6px 0 10px;line-height:1.45}
.calpts{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:8px 0}
.calpts label{display:flex;align-items:center;gap:4px;font-weight:800}
.calpts input{width:64px;background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:6px;color:var(--fg)}
.calmini svg{width:150px;height:150px;display:block;margin:6px 0 10px}
.set select{background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;color:var(--fg);max-width:260px}
.set input[type=range]{width:min(300px,40vw);accent-color:var(--accent)}

<script>
/* ===================== Utilidades ===================== */

const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function toast(m){ document.querySelectorAll('.toast').forEach(t=>t.remove()); const d=document.createElement('div'); d.className='toast'; d.textContent=m; document.body.appendChild(d); setTimeout(()=>d.remove(),2600); }
function showErr(m){ const t=$('tMain'), u=$('tSub'); if(t){ t.textContent='Algo ha fallado'; u.textContent=m; } }
window.addEventListener('error',e=>showErr(e.message));
window.addEventListener('unhandledrejection',e=>showErr(String(e.reason&&e.reason.message||e.reason)));
setInterval(()=>{const d=new Date();$('clock').textContent=two(d.getHours())+':'+two(d.getMinutes())},1000);

/* ===================== Estilos de mapa ===================== */
const THEMES={

  googledia:{google:true,name:'Google Maps día',sub:'El mapa normal, siempre claro',land:'#f1f3f4',block:'#e8eaed',park:'#c3ecb2',water:'#aadaff',road:'#ffffff',edge:'#dadce0',hwy:'#fdd663',text:'#3c4043',halo:'#ffffff',route:'#1a73e8',car:'#1a73e8',shape:'circle'},
  googlenoche:{google:true,night:true,name:'Google Maps noche',sub:'El modo noche de Google, siempre',land:'#242f3e',block:'#2b3647',park:'#263c3f',water:'#17263c',road:'#38414e',edge:'#212a37',hwy:'#746855',text:'#d59563',halo:'#242f3e',route:'#4c8df6',car:'#4c8df6',shape:'circle'},
  v:{name:'Ciudad 2013',sub:'Inspirado en GTA V',land:'#2b3530',block:'#36413b',park:'#2f4a34',water:'#21405f',road:'#8e959b',edge:'#161a1d',hwy:'#b3b9be',text:'#d6dbe0',halo:'#1a1f1c',route:'#b44fe0',car:'#ffffff',shape:'rect'},
  vc:{name:'Neón 86',sub:'Inspirado en Vice City',land:'#150e2c',block:'#1d1540',park:'#0f3436',water:'#0a4a66',road:'#ff3fa4',edge:'#150e2c',hwy:'#ff9ad2',text:'#00f0ff',halo:'#150e2c',route:'#ffe14d',car:'#00f0ff',shape:'circle'},

  iv:{name:'Gris 2008',sub:'Inspirado en GTA IV',land:'#484d53',block:'#575d64',park:'#4b584c',water:'#2d3b48',road:'#c8cbcf',edge:'#2f3338',hwy:'#e5e7e9',text:'#e6e8ea',halo:'#2f3338',route:'#e85aa8',car:'#ffd23f',shape:'circle'},
  noche:{name:'Noche',sub:'Navegador clásico',land:'#141920',block:'#1b2129',park:'#16301e',water:'#1c3956',road:'#3a4350',edge:'#0e1217',hwy:'#56616f',text:'#9aa4b1',halo:'#0e1217',route:'#3b9cff',car:'#ffffff',shape:'rect'},
  dia:{name:'Día',sub:'Navegador clásico',land:'#ebe6dc',block:'#e0d9cb',park:'#bde0b2',water:'#9cc8ec',road:'#ffffff',edge:'#c6bead',hwy:'#ffd27a',text:'#4a4f55',halo:'#ffffff',route:'#1d74e8',car:'#1d74e8',shape:'rect'},
};

const GOOGLE_NIGHT=[{elementType:'geometry',stylers:[{color:'#242f3e'}]},{elementType:'labels.text.stroke',stylers:[{color:'#242f3e'}]},{elementType:'labels.text.fill',stylers:[{color:'#746855'}]},

/* ¿Es de noche? Salida y puesta del sol aproximadas (fórmula de la NOAA) */
function esDeNoche(lat=40.19,lng=-3.67,d=new Date()){
  const rad=Math.PI/180, N=Math.floor((d-new Date(d.getFullYear(),0,0))/864e5), g=2*Math.PI/365*(N-1+(d.getHours()-12)/24);
  const eq=229.18*(0.000075+0.001868*Math.cos(g)-0.032077*Math.sin(g)-0.014615*Math.cos(2*g)-0.040849*Math.sin(2*g));
  const de=0.006918-0.399912*Math.cos(g)+0.070257*Math.sin(g)-0.006758*Math.cos(2*g)+0.000907*Math.sin(2*g)-0.002697*Math.cos(3*g)+0.00148*Math.sin(3*g);
  const ha=Math.acos(Math.cos(90.833*rad)/(Math.cos(lat*rad)*Math.cos(de))-Math.tan(lat*rad)*Math.tan(de))/rad;
  const mid=720-4*lng-eq, sale=mid-4*ha, pone=mid+4*ha, ahora=d.getUTCHours()*60+d.getUTCMinutes();
  return ahora<sale||ahora>pone;
}
const themeNight=t=>!!(t&&t.google&&(t.night||(t.auto&&esDeNoche(S&&S.pos?S.pos.lat:40.19,S&&S.pos?S.pos.lng:-3.67))));
const themeNow=t=>t&&t.auto&&themeNight(t)?THEMES.googlenoche:t;
const gStyle=t=>t.google?(themeNight(t)?GOOGLE_NIGHT:[]):gStyleGTA(t);

/* ===================== Navegación entre vistas ===================== */
function setView(v){
  if(v==='destinos'){ v='mapas'; setTimeout(destScreen,50); }
  if(v==='estilos'){ v=S.view==='panel'?'panel':'mapas'; setTimeout(styleScreen,50); }
  if(APPS.some(a=>a.id===v)&&v!=='panel') S.recentApps=[v,...S.recentApps.filter(x=>x!==v)].slice(0,3);
  S.view=v; const m=$('main');
  m.dataset.view=v; m.classList.toggle('inapp',!(v==='panel'||v==='mapas'));
  renderApp(); renderDock(); renderCards(); setTimeout(placeYT,30); setTimeout(placeYT,320);
  if(map) setTimeout(()=>{ if(S.pos&&S.follow) map.panTo(S.pos); },300);

  $('recents').innerHTML=S.recentApps.map(id=>`<button data-open="${id}" aria-label="${app(id).name}">${icon(app(id),id==='musica'&&MU.playing())}</button>`).join('');

}

  if(v==='motor') updateEngineUI();

  home:()=>`<div class="abody home" style="display:flex"><div class="grid">${APPS.map(a=>`<button class="tile" data-open="${a.id}">${icon(a,a.id==='musica'&&MU.playing())}<span>${a.name}</span></button>`).join('')}</div></div>`,

    <div class="list">${[['Mamá','Móvil'],['Alejandra','Móvil'],['Taller','Fijo'],['Cochera','Fijo']].map(c=>`<button class="row" data-toast="Llamando a ${c[0]}…"><span class="av">${c[0][0]}</span><span class="t"><b>${c[0]}</b><small>${c[1]}</small></span><span class="pill on">Llamar</span></button>`).join('')}</div>

function say(text){

  const u=new SpeechSynthesisUtterance(text); u.lang='es-ES'; u.rate=1.02;
  const v=speechSynthesis.getVoices().find(v=>v.lang&&v.lang.startsWith('es')); if(v) u.voice=v;

const AUDIO_RE=/\.(mp3|m4a|aac|ogg|oga|opus|wav|flac|webm)$/i;
const M={
  tracks:[],order:[],pos:-1,playing:false,shuffle:false,repeat:'all',dirName:'',savedDir:null,filter:'',url:null,baseVol:+(LS.get('rp-vol')||0.8),ducked:false,
  a:$('audio'),
  cur(){ return this.pos>=0?this.tracks[this.order[this.pos]]:null; },
  setTracks(list,name){
    this.tracks=list.sort((x,y)=>x.path.localeCompare(y.path,'es',{numeric:true})); this.dirName=name||'';
    this.order=this.tracks.map((_,i)=>i); if(this.shuffle) this.shuffleOrder(-1);
    this.pos=-1; readTags(); toast(`${this.tracks.length} canciones cargadas`); refreshMusic();
  },
  shuffleOrder(keep){ const o=this.tracks.map((_,i)=>i).filter(i=>i!==keep); for(let i=o.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[o[i],o[j]]=[o[j],o[i]];} this.order=keep>=0?[keep,...o]:o; },
  playIdx(trackIndex){ this.pos=this.order.indexOf(trackIndex); this.load(true); },
  load(autoplay){
    const t=this.cur(); if(!t) return; MU.setSrc('local');
    if(this.url) URL.revokeObjectURL(this.url);
    this.url=URL.createObjectURL(t.file); this.a.src=this.url; this.a.volume=this.ducked?this.baseVol*.25:this.baseVol;
    if(autoplay) this.a.play().catch(()=>{});
    setSession(t); refreshMusic();
  },
  toggle(){ if(!this.cur()){ if(this.tracks.length){ this.pos=0; this.load(true); } return; } this.a.paused?this.a.play().catch(()=>{}):this.a.pause(); },
  next(auto){
    if(!this.tracks.length) return;
    if(auto&&this.repeat==='one'){ this.a.currentTime=0; this.a.play(); return; }
    if(this.pos>=this.order.length-1){ if(auto&&this.repeat==='off'){ this.a.pause(); return; } this.pos=0; } else this.pos++;
    this.load(true);
  },
  prev(){ if(this.a.currentTime>3){ this.a.currentTime=0; return; } this.pos=this.pos<=0?this.order.length-1:this.pos-1; this.load(true); },
  duck(on){ this.ducked=on; this.a.volume=on?this.baseVol*.25:this.baseVol; },
};

function trackFromFile(file,path){
  const base=file.name.replace(/\.[^.]+$/,'').replace(/^\d+[\s.\-_]+/,'');
  const parts=base.split(' - ');
  const folder=(path||'').split('/').slice(-2,-1)[0]||'';
  return {file,path:path||file.name,title:parts.length>1?parts.slice(1).join(' - '):base,artist:parts.length>1?parts[0]:'',album:folder,cover:null};
}
async function collectDir(h,prefix='',out=[],depth=0){
  for await (const e of h.values()){
    if(e.kind==='file'&&AUDIO_RE.test(e.name)){ out.push(trackFromFile(await e.getFile(),prefix+e.name)); }
    else if(e.kind==='directory'&&depth<4){ await collectDir(e,prefix+e.name+'/',out,depth+1); }
  }
  return out;
}

const idb=()=>new Promise((res,rej)=>{ const r=indexedDB.open('radar-play',1); r.onupgradeneeded=()=>r.result.createObjectStore('kv'); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); });
async function idbSet(k,v){ try{ const db=await idb(); db.transaction('kv','readwrite').objectStore('kv').put(v,k); }catch(e){} }
async function idbGet(k){ try{ const db=await idb(); return await new Promise(r=>{ const q=db.transaction('kv').objectStore('kv').get(k); q.onsuccess=()=>r(q.result); q.onerror=()=>r(null); }); }catch(e){ return null; } }

}

/* Etiquetas ID3 (título, artista, carátula) */
let tagBusy=false;
async function readTags(){
  if(tagBusy||!window.jsmediatags) return; tagBusy=true;
  for(const t of M.tracks){
    if(t.tagged) continue; t.tagged=true;
    await new Promise(res=>{ try{ window.jsmediatags.read(t.file,{onSuccess:r=>{ const g=r.tags||{};
        if(g.title) t.title=g.title; if(g.artist) t.artist=g.artist; if(g.album) t.album=g.album;
        if(g.picture&&g.picture.data){ try{ t.cover=URL.createObjectURL(new Blob([new Uint8Array(g.picture.data)],{type:g.picture.format||'image/jpeg'})); }catch(e){} }
        res(); },onError:()=>res()}); }catch(e){ res(); } });
    if(t===M.cur()) { setSession(t); refreshMusic(); }
  }
  tagBusy=false; refreshMusic();
}
function setSession(t){
  if(!('mediaSession' in navigator)||!t) return;
  navigator.mediaSession.metadata=new MediaMetadata({title:t.title,artist:t.artist||'',album:t.album||'',artwork:t.cover?[{src:t.cover,sizes:'512x512'}]:[]});
}
if('mediaSession' in navigator){
  const ms=navigator.mediaSession, h=(a,f)=>{ try{ ms.setActionHandler(a,f); }catch(e){} };
  h('play',()=>M.toggle()); h('pause',()=>M.toggle()); h('previoustrack',()=>M.prev()); h('nexttrack',()=>M.next());
  h('seekto',d=>{ if(d.seekTime!=null) M.a.currentTime=d.seekTime; });
}

const decH=s=>{ const t=document.createElement('textarea'); t.innerHTML=s; return t.value; };
const tabsHTML=()=>`<span class="dnasel" style="margin-right:6px"><button style="width:auto;padding:0 14px;font-size:16px" class="${MU.src==='yt'?'on':''}" data-src="yt">YouTube</button><button style="width:auto;padding:0 14px;font-size:16px" class="${MU.src==='local'?'on':''}" data-src="local">Mi carpeta</button></span>`;
const Y={player:null,ready:false,loading:false,playing:false,results:[],idx:-1,mode:'none',title:'',channel:'',pending:null,ducked:false,
  vol:+(LS.get('rp-yvol')||80),key:LS.get('rp-ytkey')||'',saved:JSON.parse(LS.get('rp-ysaved')||'[]'),
  has(){ return this.mode!=='none'; },
  toggle(){ if(!this.ready||!this.has()) return; this.playing?this.player.pauseVideo():this.player.playVideo(); },
  next(){ if(!this.ready) return; if(this.mode==='list') this.player.nextVideo(); else if(this.mode==='queue'&&this.idx<this.results.length-1) this.playRes(this.idx+1); },
  prev(){ if(!this.ready) return; if(this.player.getCurrentTime()>3){ this.player.seekTo(0,true); return; } if(this.mode==='list') this.player.previousVideo(); else if(this.mode==='queue'&&this.idx>0) this.playRes(this.idx-1); },
  playRes(i){ const r=this.results[i]; if(!r) return; this.idx=i; this.mode='queue'; this.title=r.title; this.channel=r.channel; this.run(()=>this.player.loadVideoById(r.id)); },
  playVideo(id,title){ this.results=[{id,title:title||'Vídeo de YouTube',channel:'',thumb:`https://i.ytimg.com/vi/${id}/default.jpg`}]; this.playRes(0); },
  playList(list,title){ this.mode='list'; this.idx=-1; this.title=title||'Lista de YouTube'; this.channel=''; this.run(()=>this.player.loadPlaylist({list,listType:'playlist'})); },
  run(fn){ MU.setSrc('yt'); if(!this.ready){ this.pending=fn; ensureYT(); toast('Cargando YouTube…'); } else fn(); refreshMusic(); },
  duck(on){ this.ducked=on; if(this.ready) this.player.setVolume(on?Math.round(this.vol*.25):this.vol); },
  save(item){ this.saved=[item,...this.saved.filter(x=>x.id!==item.id)].slice(0,12); LS.set('rp-ysaved',JSON.stringify(this.saved)); },
};
function ensureYT(){
  if(Y.loading) return; Y.loading=true;

function ytParse(t){
  try{ const u=new URL(t); const list=u.searchParams.get('list'); let v=u.searchParams.get('v');
    if(!v&&/youtu\.be$/.test(u.hostname)) v=u.pathname.slice(1,12);
    const m=u.pathname.match(/\/(shorts|embed|live)\/([\w-]{11})/); if(!v&&m) v=m[2];
    if(v) return {type:'video',id:v}; if(list) return {type:'list',id:list}; }catch(e){}
  if(/^[\w-]{11}$/.test(t)) return {type:'video',id:t};
  return null;
}
async function ytGo(text){
  text=(text||'').trim(); if(!text) return;
  const p=ytParse(text);
  if(p&&p.type==='list'){ Y.save({type:'list',id:p.id,title:'Lista de YouTube'}); Y.playList(p.id); return; }
  if(p){ Y.save({type:'video',id:p.id,title:'Vídeo de YouTube'}); Y.playVideo(p.id); return; }
  if(!Y.key){ toast('Para buscar escribiendo, añade una clave de YouTube en Ajustes'); return; }
  const L=$('yList'); if(L) L.innerHTML='<p class="muted">Buscando…</p>';
  try{
    const r=await fetch(`https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&videoEmbeddable=true&maxResults=15&q=${encodeURIComponent(text)}&key=${encodeURIComponent(Y.key)}`);
    const j=await r.json();
    if(j.error){ if($('yList')) $('yList').innerHTML=`<p class="note">YouTube responde: ${esc(j.error.message)}</p>`; return; }
    Y.results=(j.items||[]).filter(i=>i.id&&i.id.videoId).map(i=>({id:i.id.videoId,title:decH(i.snippet.title),channel:decH(i.snippet.channelTitle),thumb:(i.snippet.thumbnails.default||{}).url}));
    if(Y.mode==='queue') Y.idx=-1;
    refreshMusic();
  }catch(e){ if($('yList')) $('yList').innerHTML='<p class="note">No se pudo buscar. Comprueba la conexión.</p>'; }
}

setInterval(()=>{
  if(E.real){ updateEngineUI(); return; }
  const rng={D:[55,115],N:[40,90],A:[30,70]}[E.dna];
  if(S.sim&&typeof NAV!=='undefined'&&NAV.targetKmh!=null) E.target=NAV.targetKmh; else if(S.sim){ if(E.target===0||Math.random()<.03) E.target=rng[0]+Math.random()*(rng[1]-rng[0]); } else if(typeof GPS!=='undefined'&&GPS.ok) E.target=GPS.speed; else E.target=0;

  const up=E.dna==='D'?1.25:1; let g=0; if(E.v>1){ g=1; [0,15,30,48,68,88].forEach((t,i)=>{ if(E.v>t*up) g=i+1; }); } E.gear=Math.min(6,g);

const gDisp={};
function drawGauge(g){
  const c=$(g.id); if(!c) return; const r=c.getBoundingClientRect(); if(!r.width) return;
  const dpr=devicePixelRatio||1; if(c.width!==Math.round(r.width*dpr)||c.height!==Math.round(r.height*dpr)){ c.width=Math.round(r.width*dpr); c.height=Math.round(r.height*dpr); }
  const x=c.getContext('2d'); x.setTransform(dpr,0,0,dpr,0,0);
  const W=r.width,H=r.height,cx=W/2,cy=H*.56,R=Math.min(W/2,H*.52)-8, acc=getComputedStyle(document.documentElement).getPropertyValue('--accent').trim()||'#ff2b34';
  const raw=g.get();
  if(raw==null){ x.clearRect(0,0,W,H); x.strokeStyle=E.dna==='D'?'#2a1518':'#20262e'; x.lineWidth=R*.16; x.beginPath(); x.arc(cx,cy,R,.8*Math.PI,2.2*Math.PI); x.stroke();
    x.textAlign='center'; x.textBaseline='middle'; x.fillStyle='#5b6470'; x.font=`italic 800 ${R*.46}px "Barlow Condensed", sans-serif`; x.fillText('—',cx,cy);
    x.font=`600 ${Math.max(9,R*.12)}px Barlow, sans-serif`; x.fillText('Sin dato OBD',cx,cy+R*.36);
    x.fillStyle=E.dna==='D'?'#ff6b70':'#8a94a1'; x.font=`800 ${Math.max(10,R*.15)}px Barlow, sans-serif`; x.fillText(g.label,cx,H-10); gDisp[g.id]=null; return; }
  gDisp[g.id]=gDisp[g.id]==null?raw:gDisp[g.id]+(raw-gDisp[g.id])*.2; const v=gDisp[g.id];
  const a0=.8*Math.PI,a1=2.2*Math.PI,ang=val=>a0+Math.max(0,Math.min(1,(val-g.min)/(g.max-g.min)))*(a1-a0);
  x.clearRect(0,0,W,H); x.lineCap='butt';
  x.strokeStyle=E.dna==='D'?'#2a1518':'#20262e'; x.lineWidth=R*.16; x.beginPath(); x.arc(cx,cy,R,a0,a1); x.stroke();
  if(g.warn!=null){ x.strokeStyle='rgba(255,43,52,.55)'; x.lineWidth=R*.05; x.beginPath(); x.arc(cx,cy,R+R*.13,ang(g.warn),a1); x.stroke(); }
  const hot=g.warn!=null&&v>=g.warn;
  x.strokeStyle=hot?'#ff2b34':acc; x.lineWidth=R*.16; if(E.dna==='D'){ x.shadowColor=x.strokeStyle; x.shadowBlur=12; }
  x.beginPath(); x.arc(cx,cy,R,a0,ang(v)); x.stroke(); x.shadowBlur=0;
  x.strokeStyle='rgba(255,255,255,.35)'; x.lineWidth=1.5;
  for(let k=0;k<=10;k++){ const a=a0+k/10*(a1-a0), r1=R-R*.12, r2=R-R*(k%5===0?.32:.22); x.beginPath(); x.moveTo(cx+Math.cos(a)*r1,cy+Math.sin(a)*r1); x.lineTo(cx+Math.cos(a)*r2,cy+Math.sin(a)*r2); x.stroke(); }
  x.textAlign='center'; x.textBaseline='middle';
  x.fillStyle=hot?'#ff4d4f':'#f1f4f7'; x.font=`italic 800 ${R*.46}px "Barlow Condensed", sans-serif`; x.fillText(es2(v,g.dec),cx,cy+R*.02);
  x.fillStyle='#8a94a1'; x.font=`700 ${R*.16}px Barlow, sans-serif`; x.fillText(g.unit,cx,cy+R*.36);
  x.fillStyle=E.dna==='D'?'#ff6b70':'#8a94a1'; x.font=`800 ${Math.max(10,R*.15)}px Barlow, sans-serif`; x.fillText(g.label,cx,H-10);
  x.fillStyle='#5b6470'; x.font=`600 ${Math.max(9,R*.12)}px Barlow, sans-serif`;
  x.fillText(es2(g.min,g.max<10?1:0),cx+Math.cos(a0)*R*.78,cy+Math.sin(a0)*R*.78+R*.2); x.fillText(es2(g.max,g.max<10?1:0),cx+Math.cos(a1)*R*.78,cy+Math.sin(a1)*R*.78+R*.2);
}

/* ===================== Puente (OBD-II real y CarPlay) ===================== */
async function pollOBD(){
  try{
    const r=await fetch('/api/obd',{cache:'no-store'}); if(!r.ok) return; const d=await r.json();
    E.obdMsg=d.estado||''; const was=E.real; E.real=!!d.ok&&(Date.now()/1000-d.ts)<5;
    if(E.real){
      if(d.rpm!=null) E.rpm=d.rpm; if(d.speed!=null) E.v=d.speed; if(d.boost!=null) E.boost=Math.min(2.5,d.boost);
      if(d.coolant!=null) E.coolant=d.coolant; if(d.iat!=null) E.iat=d.iat; if(d.throttle!=null) E.thr=d.throttle; if(d.volt!=null) E.volt=d.volt;
      E.oil=d.oil!=null?d.oil:null; E.egt=null; E.cons=null;
      if(E.v>3){ const q=E.rpm/E.v; let best=1,bd=1e9; RATIO.forEach((x,i)=>{ if(i&&Math.abs(x-q)<bd){ bd=Math.abs(x-q); best=i; } }); E.gear=best; } else E.gear=0;
    }
    if(was!==E.real){ if(!E.real){ E.oil=94; E.egt=180; E.cons=0; } toast(E.real?'OBD-II conectado: datos reales':'OBD-II desconectado: datos simulados'); renderCards(); if(S.view==='motor') renderApp(); }
    setTimeout(pollOBD,E.real?150:2000);
  }catch(e){ /* sin puente: se queda en simulación */ }
}
async function checkBridge(){
  if(!location.protocol.startsWith('http')) return;
  try{ const r=await fetch('/api/estado',{cache:'no-store'}); if(!r.ok) return; const d=await r.json(); if(d.carplay) $('cpb').hidden=false; pollOBD(); }catch(e){}

}

    const {routes:rs}=await Route.computeRoutes({origin:S.start,destination:'Plaza de la Constitución, Valdemoro',travelMode:'DRIVING',fields:['path']});
    const p=rs&&rs[0]&&rs[0].path&&rs[0].path[0];
    if(p){ const ll=toLL(p); S.follow=true; moveCar(ll.toJSON()); map.setCenter(ll); }
  }catch(e){ showErr('No he podido situar el punto de salida: '+(e.message||e)); }
}
function moveCar(p){
  S.pos=p; if(!carMarker) return; carMarker.setPosition(p); carMarker.setIcon(carIcon());
  radar.setCenter(p); $('radarmap').style.transform=`rotate(${-S.heading}deg)`; $('radarcar').style.setProperty('--h','0deg');
  if(S.follow){ if(typeof NAV!=='undefined'&&NAV.active) followCam(); else map.panTo(p); }
}
function setGuide(main,sub){ $('tMain').textContent=main; $('tSub').textContent=sub; if($('pMain')){ $('pMain').textContent=main; $('pSub').textContent=sub; } }

/* ===================== Clics ===================== */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-open],[data-act],[data-m],[data-play],[data-toast],[data-say],[data-dna],[data-src],[data-y],[data-yres],[data-ysaved],#homebtn,#dnab,#cpb'); if(!el) return;
  const d=el.dataset;
  if(el.id==='homebtn'){ setView(S.view==='home'?'panel':'home'); return; }
  if(el.id==='cpb'){ openCarPlay(); return; }
  if(el.id==='dnab'){ setDNA({N:'D',D:'A',A:'N'}[E.dna]); return; }
  if(d.dna){ e.stopPropagation(); setDNA(d.dna); return; }
  if(d.src){ MU.setSrc(d.src); refreshMusic(); return; }
  if(d.y==='go'){ ytGo($('yIn').value); return; }
  if(d.yres){ Y.playRes(+d.yres); return; }
  if(d.ysaved){ const it=Y.saved[+d.ysaved]; if(it){ it.type==='list'?Y.playList(it.id,it.title):Y.playVideo(it.id,it.title); } return; }
  if(d.m){ e.stopPropagation(); ({toggle:()=>MU.toggle(),next:()=>MU.next(),prev:()=>MU.prev(),pick:pickMusic,reconnect,files:()=>filesIn.click(),
      shuffle:()=>{ M.shuffle=!M.shuffle; const cur=M.order[M.pos]; if(M.shuffle) M.shuffleOrder(cur??-1); else M.order=M.tracks.map((_,i)=>i); M.pos=cur!=null?M.order.indexOf(cur):-1; refreshMusic(); },
      repeat:()=>{ M.repeat={all:'one',one:'off',off:'all'}[M.repeat]; refreshMusic(); }})[d.m](); return; }
  if(d.play){ M.playIdx(+d.play); return; }
  if(d.toast){ toast(d.toast); return; }
  if(d.say){ say(d.say); return; }
  if(d.act){ const a=d.act;
    if(a==='dest') destScreen(); else if(a==='style') styleScreen(); else if(a==='key') keyScreen();
    else if(a==='center'){ S.follow=true; if(map&&S.pos) map.panTo(S.pos); }
    else if(a==='sim') toggleSim(); else if(a==='end') clearRoute();
    else if(a==='zin'&&map) map.setZoom(map.getZoom()+1); else if(a==='zout'&&map) map.setZoom(map.getZoom()-1);
    return; }
  if(d.open){ setView(d.open); }
});
document.addEventListener('keydown',e=>{ if(e.target.tagName==='INPUT') return; if(e.code==='Space'){ e.preventDefault(); MU.toggle(); } });
