# ============================================================
#  Ajustes del sistema Radar Play (Raspberry Pi)
#  Cambia un valor, guarda y reinicia la Raspberry.
# ============================================================

# Puerto de la web local
PUERTO=8080

# --- Pantalla ---
# Giro en grados: 0, 90, 180 o 270. La pantalla oficial Touch Display 2
# viene en vertical (720x1280): pon 90 (o 270, según cómo la montes) para
# usarla en horizontal (1280x720). Las pantallas HDMI normales: 0.
PANTALLA_GIRO=0
# Tamaño de todo lo que se ve: 1 = normal (para 1280x720 o 1024x600).
# Para pantallas grandes, como la Touch Display 2 de 10" (1920x1200), pon 1.5.
PANTALLA_ESCALA=1

# --- Apagado al quitar la llave ---
# Pin GPIO (numeración BCM) que recibe la señal de contacto a través de un
# optoacoplador. -1 = desactivado (déjalo así hasta tener el cable montado,
# o la Raspberry se apagará sola en casa).
PIN_CONTACTO=-1
# 1 si el pin se pone a masa (0 V) cuando hay contacto (lo normal con optoacoplador)
CONTACTO_ACTIVO_BAJO=1
# Segundos sin contacto antes de apagarse (se puede cancelar en pantalla)
APAGADO_SEGUNDOS=30

# --- Cámara de marcha atrás ---
# Pin GPIO (BCM) que recibe la luz de marcha atrás por un optoacoplador.
# -1 = desactivado. Con él, la cámara trasera se abre sola al meter la marcha atrás.
PIN_MARCHA_ATRAS=-1
MARCHA_ATRAS_ACTIVO_BAJO=1

# --- Dispositivos USB ---
# Lector OBD-II ELM327: auto, /dev/ttyUSB0, /dev/rfcomm0 (Bluetooth)…
OBD_PUERTO=auto
# GPS USB (los u-blox tipo VK-162 suelen ser /dev/ttyACM0)
GPS_PUERTO=/dev/ttyACM0

# --- CarPlay ---
# Programa de CarPlay (react-carplay). Vacío = sin botón CarPlay en el dock.
# Ejemplo: CARPLAY_CMD=/home/pi/Applications/react-carplay.AppImage
CARPLAY_CMD=

# Repositorio de GitHub de donde se descargan las actualizaciones
ACTUALIZAR_GITHUB=morantuzo/radar-play

# Mando desde el iPhone por WiFi (1 = sí, 0 = no)
MANDO_IPHONE=1

# ============================================================
#  Piezas opcionales (todo funciona sin ellas; ver Sistema › Hardware)
# ============================================================
# --- Puerta del garaje ---
# Por radio 433 MHz (como un mando): emisor FS1000A y receptor RXB6.
# Se aprende en Ajustes › Garaje › Aprender mando.
RF_PIN_TX=17
RF_PIN_RX=27
# O un relé en paralelo con el botón de un mando de verdad (-1 = sin relé)
PIN_GARAJE=-1
GARAJE_ACTIVO_BAJO=0
GARAJE_PULSO_MS=600

# --- iPhone por Bluetooth (llamadas, música, contactos) y sensores de ruedas ---
BLUETOOTH=1
RUEDAS=1

# --- Acelerómetro MPU-6050 (I2C): fuerzas G reales y golpes para la dashcam ---
ACELEROMETRO=0
# Qué eje del sensor apunta hacia el morro del coche: x, -x, y o -y
ACEL_ADELANTE=x
GOLPE_G=2.5

# --- Dashcam: cámara USB delantera solo para grabar (vacío = sin dashcam) ---
DASHCAM_CAMARA=
DASHCAM_GB=8
DASHCAM_RES=1280x720

# --- Tira LED WS2812 al GPIO10 (pin 19): número de LEDs (0 = sin tira) ---
LEDS=0
LEDS_BRILLO=60

# --- Filtro de partículas: PIDs propios de la centralita (opcional) ---
# Formato: nombre|comando|cabecera|fórmula ; nombre|...   (A, B, C, D = bytes de la respuesta)
# Nombres que entiende Radar Play: hollin (%), regen (0/1), km_regen (km desde la última limpieza).
# Los de tu centralita (Bosch EDC17 del 1.6 JTDM) se sacan con MultiECUScan o Alfa OBD.
OBD_EXTRA=

# --- Registro (log) para depurar: datos/logs/radar-play.log ---
# info = arranque, acciones, cambios de estado y errores. debug = además cada petición.
LOG_NIVEL=info
